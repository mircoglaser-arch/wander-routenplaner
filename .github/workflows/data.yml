name: Wegenetz aufbereiten

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 2 * *'   # monatlich am 2., 03:17 UTC
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/data.yml']

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium pillow numpy

      - name: OSM-Daten Deutschland laden, Wanderrouten, Wege und Waldflächen filtern
        run: |
          mkdir -p work && cd work
          curl -fsSL --retry 3 -o germany.poly https://download.geofabrik.de/europe/germany.poly
          curl -fsSL --retry 3 -o germany.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf
          osmium tags-filter germany.pbf r/route=hiking,foot w/highway=track,path,footway,bridleway,pedestrian,living_street,residential,unclassified,service,cycleway,steps -o routes.pbf
          osmium tags-filter germany.pbf wr/landuse=forest wr/natural=wood -o forest.pbf
          rm germany.pbf
          ls -lh
          df -h .

      - name: Kacheln erzeugen
        run: |
          python3 scripts/build_tiles.py work/routes.pbf out --forest work/forest.pbf --poly work/germany.poly
          du -sh out

      - name: Auf Branch "data" veröffentlichen
        run: |
          cd out
          echo "Wegedaten © OpenStreetMap-Mitwirkende, ODbL 1.0 – https://www.openstreetmap.org/copyright" > LICENSE-DATA.txt
          git init -q -b data
          git config user.name "wander-routenplaner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Wegenetz $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
